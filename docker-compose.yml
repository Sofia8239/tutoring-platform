# Local development infrastructure only. Not for production.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: tutoring_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutoring
      POSTGRES_PASSWORD: tutoring
      POSTGRES_DB: tutoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutoring -d tutoring"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tutoring_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
